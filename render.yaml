services:
  - type: web
    name: bloodlink-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://blood-link-zeta-two.vercel.app
      - key: MONGO_URI
        sync: false
